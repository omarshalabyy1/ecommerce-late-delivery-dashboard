<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Sales performance dashboard. 96,478 orders: orders that arrived late scored 2.27 stars against 4.29 on time, and the top 10% of sellers brought 67% of revenue. 2018 revenue up 145.1%; 6.8% of orders arrive late. A terminal checks the input files and writes the Power BI project: 5 pages, 56 visuals, 23 measures.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.55" stop-color="#10213A"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#14B8A6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#14B8A6" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .sans { font-family: "Segoe UI", -apple-system, Helvetica, Arial, sans-serif; }
    .mono { font-family: "Fira Code", Consolas, "Courier New", monospace; font-size: 14px; }
    .wave { fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 2 10; animation: flow 6s linear infinite; }
    @keyframes flow { to { stroke-dashoffset: -120; } }
    .blink { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .pulse { animation: pulse 3s ease-in-out infinite; transform-origin: 920px 62px; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.85; } 50% { transform: scale(1.08); opacity: 1; } }
  </style>

  <rect width="1000" height="300" rx="22" fill="url(#bg)"/>
  <circle cx="880" cy="70" r="190" fill="url(#glowA)"/>
  <circle cx="160" cy="280" r="170" fill="url(#glowB)"/>

  <path class="wave" stroke="#2DD4BF" stroke-opacity="0.55" d="M0 262 C 150 228, 300 298, 480 262 S 780 234, 1000 258"/>
  <path class="wave" stroke="#A78BFA" stroke-opacity="0.45" style="animation-duration:9s" d="M0 282 C 180 256, 330 304, 520 278 S 820 254, 1000 276"/>

  <!-- Terminal: the repo's own commands and what they print -->
  <rect x="50" y="62" width="330" height="168" rx="14" fill="#0F172A" fill-opacity="0.92" stroke="#334155"/>
  <circle cx="74" cy="84" r="6" fill="#FF5F57"/>
  <circle cx="94" cy="84" r="6" fill="#FEBC2E"/>
  <circle cx="114" cy="84" r="6" fill="#28C840"/>
  <text x="72" y="120" class="mono" fill="#5EEAD4">$ python config.py</text>
  <text x="72" y="145" class="mono" fill="#C4B5FD">config and input files OK</text>
  <text x="72" y="168" class="mono" fill="#5EEAD4">$ python powerbi/build_pbip.py</text>
  <text x="72" y="191" class="mono" fill="#C4B5FD">written sales-performance.pbip:</text>
  <text x="72" y="214" class="mono" fill="#4ADE80">5 pages, 56 visuals, 23 measures</text>
  <rect x="352" y="202" width="9" height="16" fill="#4ADE80" class="blink"/>

  <!-- Title -->
  <text x="420" y="88" class="sans" font-size="13" font-weight="600" letter-spacing="1.5" fill="#5EEAD4">PROJECT · SALES DASHBOARD</text>
  <text x="420" y="130" class="sans" font-size="36" font-weight="700" fill="#FFFFFF">Sales performance dashboard</text>
  <text x="421" y="162" class="sans" font-size="15" fill="#CBD5E1">96,478 orders: orders that arrived late scored 2.27 stars against 4.29 on time,</text>
  <text x="421" y="184" class="sans" font-size="15" fill="#CBD5E1">and the top 10% of sellers brought 67% of revenue.</text>

  <rect x="420" y="202" width="140" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="490" y="222" class="sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">96,478 orders</text>
  <rect x="570" y="202" width="170" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="655" y="222" class="sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">2018 revenue +145.1%</text>
  <rect x="750" y="202" width="150" height="30" rx="15" fill="#14B8A6" fill-opacity="0.25"/>
  <text x="825" y="222" class="sans" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">6.8% arrive late</text>

  <!-- Network mark -->
  <g class="pulse" stroke="#5EEAD4" stroke-opacity="0.8" stroke-width="1.6">
    <line x1="920" y1="62" x2="890" y2="36"/>
    <line x1="920" y1="62" x2="950" y2="36"/>
    <line x1="920" y1="62" x2="890" y2="88"/>
    <line x1="920" y1="62" x2="950" y2="88"/>
    <circle cx="920" cy="62" r="14" fill="#1E3A5F"/>
    <circle cx="890" cy="36" r="6.5" fill="#0F172A"/>
    <circle cx="950" cy="36" r="6.5" fill="#0F172A"/>
    <circle cx="890" cy="88" r="6.5" fill="#0F172A"/>
    <circle cx="950" cy="88" r="6.5" fill="#0F172A"/>
  </g>
</svg>
